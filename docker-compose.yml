services:
  postgres:
    image: postgres:16-alpine
    container_name: car-rental-postgres
    environment:
      POSTGRES_DB: carrental
      POSTGRES_USER: carrental
      POSTGRES_PASSWORD: carrental
    ports:
      - "5432:5432"
    volumes:
      - car-rental-pgdata:/var/lib/postgresql/data
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./src/main/resources/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carrental -d carrental"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  car-rental-pgdata:
