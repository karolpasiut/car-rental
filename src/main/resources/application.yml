server:
  port: 8080

spring:
  datasource:
    url: ${CAR_RENTAL_DB_URL:jdbc:postgresql://localhost:5432/carrental}
    username: ${CAR_RENTAL_DB_USER:carrental}
    password: ${CAR_RENTAL_DB_PASSWORD:carrental}
  sql:
    init:
      mode: never
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    serialization:
      write-dates-as-timestamps: false


logging:
  level:
    org.hibernate.SQL: warn
